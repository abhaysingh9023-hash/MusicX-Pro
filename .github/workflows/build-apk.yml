name: Build Offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Build Web App
        run: |
          cd musicx-pro*
          npm install
          npm run build

      - name: Add Capacitor & Build Android APK
        run: |
          cd musicx-pro*
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MusicX Pro" "com.musicx.offlineplayer" --web-dir=dist
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicX-Pro-Offline-APK
          path: musicx-pro*/android/app/build/outputs/apk/debug/app-debug.apk
          
